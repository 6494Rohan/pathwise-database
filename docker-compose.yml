services:
  postgres:
    build: docker/postgres
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: pathwise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
